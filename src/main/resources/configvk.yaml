# =====================================================================
#   TabVK v1.0.2  -  configvk.yaml
#   Author : BenyVK
#   GitHub : https://github.com/BenyVK
#   Website: https://www.gharri.ir
# =====================================================================
# Colors: legacy codes (&a &l &#ff00ff) and MiniMessage both work
#   MiniMessage example : <gradient:#ff0000:#0000ff>text</gradient>   <rainbow>text</rainbow>
#   Animated gradient   : <gradient:#ff5555:#5555ff:%phase%>text</gradient>
#
# Placeholders (usable everywhere):
#   %player% %ping% %ping_color% %ping_bars% %online% %max% %tps% %tps_color%
#   %world% %x% %y% %z% %health% %food% %level% %gamemode%
#   %ram_used% %ram_max% %time% %date% %group%
#   %prefix% %suffix% %name_color% %quote% %phase% %phase_neg%
#   %anim_<name>%   -> animations defined in the "animations" section
#   %icon_xxx% and anything you add in "custom-placeholders"
#   + every PlaceholderAPI placeholder (if PlaceholderAPI is installed)
# =====================================================================

settings:
  header-footer-interval: 5      # ticks between header/footer updates (20 ticks = 1 second)
  name-interval: 10              # ticks between tab-name updates (ping, prefix, ...)
  gradient-cycle-ticks: 80       # speed of animated gradients (lower = faster)
  timezone: "UTC"                # example: "Asia/Tehran", "Europe/Berlin"
  time-format: "HH:mm:ss"
  date-format: "yyyy/MM/dd"
  use-placeholderapi: true
  sort-by-group: true            # sort the tab list by RankVK group weight (higher = higher)

# Hide "plugin:command" entries (like tabvk:tabvk or minecraft:give) from the
# command suggestions, so players only see /tabvk. Typing the long form still works.
#   none = hide nothing
#   own  = hide only TabVK's (tabvk:...)
#   all  = hide every namespaced command of every plugin
hide-namespaced-commands: own

# ---------------------------------------------------------------------
# Header and footer
# ---------------------------------------------------------------------
header-footer:
  enabled: true
  header:
    - ""
    - "%anim_title%"
    - "&8&m                                   "
    - "%icon_arrow% &7Welcome <gradient:#55ffff:#ff55ff:%phase%><bold>%player%</bold></gradient> %icon_heart%"
    - ""
  footer:
    - ""
    - "%quote%"
    - ""
    - "&7Ping: %ping_bars% &f%ping%ms  &8|  &7TPS: %tps_color%%tps%"
    - "&7Online: &a%online%&7/&c%max%  &8|  &7World: &e%world%"
    - "&7%icon_sun% &f%time%  &8|  &f%date%"
    - "%anim_loading%"
    - "%anim_links%"
    - ""

# Per-world header/footer (optional). Worlds not listed use the default above.
worlds:
  world_nether:
    header:
      - ""
      - "<gradient:#ff0000:#ffaa00:%phase%><bold>NETHER</bold></gradient>"
      - ""
    footer:
      - ""
      - "&cWatch out for Ghasts! %icon_skull%"
      - "&7Ping: %ping_bars% &f%ping%ms"
      - ""

# ---------------------------------------------------------------------
# Player name in the tab list
# ---------------------------------------------------------------------
player-list:
  enabled: true
  format: "%prefix%%name_color%%player%%suffix% &8| %ping_color%%ping%ms"

# Prefix/suffix above the player's head (uses scoreboard teams).
# Keep it false if another plugin already manages teams.
nametag:
  enabled: false
  prefix: "%prefix%"
  suffix: ""

# ---------------------------------------------------------------------
# RankVK integration  (ranks come ONLY from RankVK)
#
# TabVK has no ranks of its own. For every player it reads from RankVK:
#   prefix, suffix, primary group and group weight.
# The group weight sorts the tab list (higher weight = higher in the list).
#
# TIP: RankVK also shows prefix/suffix in chat, so use legacy codes (&c) or
#      hex (&#ff5555) in them. MiniMessage tags only work inside TabVK text.
# NOTE: Minecraft removes trailing spaces from commands, so a prefix like
#      "&6[VIP]" is stored without a space. "auto-space" adds the space for you.
# ---------------------------------------------------------------------
rankvk:
  enabled: true
  auto-space: true           # add a space after the prefix / before the suffix if missing
  default-prefix: ""         # used when RankVK has no prefix for the player
  default-suffix: ""
  name-color: "&f"           # color of the player name (RankVK has no name color)
  # Name color per RankVK group (optional). Use the group names you created in RankVK.
  group-name-colors: {}
  #  Example:
  #  group-name-colors:
  #    owner: "&4"
  #    admin: "&c"
  #    mod: "&9"
  #    helper: "&b"
  #    vip: "&6"

  # -------------------------------------------------------------------
  # SAMPLE RANKS  -  copy the commands into the game chat or console.
  # They are only examples, nothing here is applied automatically.
  # Group names may only contain: a-z 0-9 _ -
  # Do NOT put quotes around the prefix, type it exactly as shown.
  # -------------------------------------------------------------------
  #
  # --- Owner (weight 100) ---
  #   /rank group owner create
  #   /rank group owner setweight 100
  #   /rank group owner setprefix &4&l[Owner]
  #   /rank group owner setsuffix &c❤
  #   /rank group owner permission set *
  #
  # --- Admin (weight 90) ---
  #   /rank group admin create
  #   /rank group admin setweight 90
  #   /rank group admin setprefix &c&l[Admin]
  #   /rank group admin setsuffix &e⚡
  #
  # --- Moderator (weight 80) ---
  #   /rank group mod create
  #   /rank group mod setweight 80
  #   /rank group mod setprefix &9&l[Mod]
  #   /rank group mod setsuffix &9⚔
  #
  # --- Helper (weight 70) ---
  #   /rank group helper create
  #   /rank group helper setweight 70
  #   /rank group helper setprefix &b[Helper]
  #
  # --- VIP (weight 50) ---
  #   /rank group vip create
  #   /rank group vip setweight 50
  #   /rank group vip setprefix &6[VIP]
  #   /rank group vip setsuffix &e★
  #
  # --- Custom hex color example (weight 40) ---
  #   /rank group elite create
  #   /rank group elite setweight 40
  #   /rank group elite setprefix &#ff5555[Elite]
  #
  # --- Default group (everyone gets it automatically) ---
  #   /rank group default setweight 0
  #   /rank group default setprefix &7
  #
  # --- Give a rank to a player ---
  #   /rank user <player> parent set owner      (replaces all other groups)
  #   /rank user <player> parent add vip        (adds one more group)
  #   /rank user <player> parent remove vip     (removes a group)
  #
  # --- Per-player prefix/suffix (only for that player) ---
  #   /rank user <player> setprefix &d[Builder]
  #   /rank user <player> setsuffix none        (removes it)
  #
  # --- Inheritance: let admin also get everything mod has ---
  #   /rank group admin parent add mod
  #
  # --- Useful ---
  #   /rank listgroups
  #   /rank group owner info
  #   /rank user <player> info
  #
  # Changes show up in the tab list within about half a second.

# ---------------------------------------------------------------------
# Players can edit their own prefix/suffix with /tabvk prefix and /tabvk suffix.
# If a player set one, it is shown instead of the RankVK prefix/suffix.
# Remove the permissions tabvk.customize.prefix / tabvk.customize.suffix
# if you only want RankVK ranks.
# ---------------------------------------------------------------------
customization:
  max-prefix-length: 20          # visible length, colors are not counted
  max-suffix-length: 20
  allow-colors-without-permission: false   # false = only players with tabvk.color can use colors

# ---------------------------------------------------------------------
# Ping colors and bars (key = maximum ping of that level)
# ---------------------------------------------------------------------
ping-levels:
  '50':   { color: "&a", bars: "&a▂▄▆█" }
  '100':  { color: "&e", bars: "&a▂▄▆&8█" }
  '200':  { color: "&6", bars: "&e▂▄&8▆█" }
  '9999': { color: "&c", bars: "&c▂&8▄▆█" }

# ---------------------------------------------------------------------
# Animations: %anim_<name>%   (interval = ticks between frames)
# ---------------------------------------------------------------------
animations:
  title:
    interval: 10
    frames:
      - "<gradient:#ff5555:#ffaa00>✦ %server_name% ✦</gradient>"
      - "<gradient:#ffaa00:#55ff55>✧ %server_name% ✧</gradient>"
      - "<gradient:#55ff55:#55ffff>✦ %server_name% ✦</gradient>"
      - "<gradient:#55ffff:#aa55ff>✧ %server_name% ✧</gradient>"
      - "<gradient:#aa55ff:#ff5555>✦ %server_name% ✦</gradient>"
      - "<rainbow>✧ %server_name% ✧</rainbow>"
  loading:
    interval: 4
    frames:
      - "&8[&a▰&8▱▱▱▱▱▱▱&8]"
      - "&8[&a▰▰&8▱▱▱▱▱▱&8]"
      - "&8[&a▰▰▰&8▱▱▱▱▱&8]"
      - "&8[&a▰▰▰▰&8▱▱▱▱&8]"
      - "&8[&a▰▰▰▰▰&8▱▱▱&8]"
      - "&8[&a▰▰▰▰▰▰&8▱▱&8]"
      - "&8[&a▰▰▰▰▰▰▰&8▱&8]"
      - "&8[&a▰▰▰▰▰▰▰▰&8]"
      - "&8[&b▰▰▰▰▰▰▰▰&8]"
      - "&8[&a▰▰▰▰▰▰▰▰&8]"
  links:
    interval: 60
    frames:
      - "&9%icon_diamond% &b%discord%"
      - "&a%icon_diamond% &e%website%"

# ---------------------------------------------------------------------
# Fun quotes (%quote%) - the next one is shown every "interval" ticks
# Tip: Minecraft's default font cannot render right-to-left scripts such as
#      Persian/Arabic correctly, so English quotes work best.
# ---------------------------------------------------------------------
quotes:
  interval: 100
  list:
    - "&7&o\"Creeper? Aw man.\""
    - "&b&o\"Diamonds are a miner's best friend.\" %icon_diamond%"
    - "&e&o\"Never dig straight down!\""
    - "&d&o\"Dream big, build bigger.\""
    - "&6&o\"It's dangerous to go alone! Take this.\" %icon_sword%"
    - "&a&o\"Sleep is for those who have beds.\" %icon_moon%"
    - "&c&o\"Trust no one. Especially Creepers.\""
    - "&5&o\"The Enderman didn't cross the road, he teleported.\""

# ---------------------------------------------------------------------
# Custom placeholders and icons  ->  %<name>%
# ---------------------------------------------------------------------
custom-placeholders:
  server_name: "MyServer"
  discord: "discord.gg/yourlink"
  website: "www.gharri.ir"
  icon_heart: "<red>❤</red>"
  icon_star: "<yellow>★</yellow>"
  icon_bolt: "<gold>⚡</gold>"
  icon_arrow: "<dark_gray>»</dark_gray>"
  icon_crown: "<gold>♛</gold>"
  icon_sword: "<gray>⚔</gray>"
  icon_diamond: "<aqua>◆</aqua>"
  icon_skull: "<dark_gray>☠</dark_gray>"
  icon_flower: "<light_purple>✿</light_purple>"
  icon_music: "<green>♫</green>"
  icon_sun: "<yellow>☀</yellow>"
  icon_moon: "<blue>☾</blue>"
  icon_check: "<green>✔</green>"
  icon_cross: "<red>✖</red>"

# ---------------------------------------------------------------------
# Messages
# ---------------------------------------------------------------------
messages:
  prefix: "&8[&bTabVK&8] "
  reloaded: "&aConfig reloaded."
  no-permission: "&cYou don't have permission."
  player-not-found: "&cPlayer not found."
  players-only: "&cOnly players can use this."
  too-long: "&cToo long! Max length: &f%max%"
  set: "&aYour &f%type% &ais now: &r%value%"
  set-other: "&a%player%'s &f%type% &ais now: &r%value%"
  reset: "&aReset to default."
  toggled-on: "&aHeader/Footer enabled."
  toggled-off: "&cHeader/Footer disabled."
  usage: "&cUsage: /tabvk <prefix|suffix> <text|reset>"
  help:
    - "&b&lTabVK &7commands:"
    - "&f/tabvk prefix <text|reset> &7- set your own prefix"
    - "&f/tabvk suffix <text|reset> &7- set your own suffix"
    - "&f/tabvk toggle &7- toggle header/footer"
    - "&f/tabvk about &7- plugin info"
    - "&f/tabvk set <player> <prefix|suffix> <text|reset> &7- admin"
    - "&f/tabvk reload &7- admin"
  about:
    - "&b&lTabVK &fv%version%"
    - "&7Author: &fBenyVK"
    - "&7GitHub: &fgithub.com/BenyVK"
    - "&7Website: &fwww.gharri.ir"
